name: Test patches

# Builds the patches and applies them with Morphe CLI to every app file in the
# draft release "apk-upload", to check which patches still match new app versions.

on:
  workflow_dispatch:

permissions:
  # Needed to see the draft release.
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Morphe CLI needs 21; the last entry (17) stays the default for the build.
          java-version: |
            21
            17

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Download Morphe CLI and app files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cli apks
          gh release download --repo MorpheApp/morphe-cli --pattern '*.jar' --dir cli
          ls -la cli
          gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft and .tag_name == "apk-upload") | .assets[] | "\(.id) \(.name)"' |
          while read -r ID NAME; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/${{ github.repository }}/releases/assets/$ID" > "apks/$NAME"
          done
          ls -la apks

      - name: Apply patches
        run: |
          CLI=$(ls -S cli/*.jar | head -n 1)
          MPP=$(ls patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -n 1)
          echo "CLI: $CLI"
          echo "Patches: $MPP"
          java() { "$JAVA_HOME_21_X64/bin/java" "$@"; }
          java -jar "$CLI" --help || true
          java -jar "$CLI" patch --help || true
          mkdir -p out logs
          for APK in apks/*; do
            NAME=$(basename "$APK")
            echo "::group::$NAME"
            java -jar "$CLI" patch --patches "$MPP" --force --continue-on-error --out "out/${NAME%.*}-patched.apk" \
              --temporary-files-path "tmp/$NAME" "$APK" 2>&1 | tee "logs/$NAME.log" || true
            echo "::endgroup::"
            {
              echo "### $NAME"
              echo '```'
              grep -E -i "SEVERE|failed|succeeded|error|Exception" "logs/$NAME.log" | head -n 200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-logs
          path: logs/
