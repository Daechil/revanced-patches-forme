name: Finish release

# Recovers a release when semantic-release committed the version bump to main
# but failed to push the tag / create the GitHub release (e.g. the
# "missing necessary objects" tag-push error). Builds the patch bundle from
# the current main and publishes the tag, release and .mpp asset directly.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v1.7.3)
        required: true

permissions:
  contents: write

jobs:
  finish:
    name: Finish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          MPP=$(ls patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -n 1)
          echo "Tag: $TAG  bundle: $MPP"
          # The newest version's notes are the top block of CHANGELOG.md,
          # up to the next version header.
          awk 'BEGIN{n=0} /^#+ \[/{n++; if(n>=2) exit} {print}' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MPP" --clobber
          else
            gh release create "$TAG" --target main --title "$TAG" --notes-file notes.md "$MPP"
          fi
          gh release view "$TAG"
